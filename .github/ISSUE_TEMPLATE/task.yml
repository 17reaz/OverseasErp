name: Task
description: Create a task/work item for development
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for general development tasks or refactoring work.

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: What needs to be done?
      placeholder: "We need to..."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Definition of done
      placeholder: |
        - [ ] Task part 1
        - [ ] Task part 2
        - [ ] Tests added
    validations:
      required: true

  - type: textarea
    id: related-files
    attributes:
      label: Related Files
      description: Files that may need changes
      placeholder: |
        - src/components/...
        - src/pages/...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
