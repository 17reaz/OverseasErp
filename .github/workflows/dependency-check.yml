name: Dependency Check

on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit
