name: Vercel Deployment Check

on:
  deployment_status:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Vercel Deployment
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Deployment successful
        run: |
          echo "Vercel deployment succeeded"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          echo "URL: ${{ github.event.deployment_status.target_url }}"

      - name: Deployment failed
        if: github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error'
        run: |
          echo "Vercel deployment failed"
          exit 1
